function defaultMapObj(){
  var o={}; DEFAULT_MAP_ARR.forEach(function(e){ o[e.prefijo]=JSON.parse(JSON.stringify(e)); });
  return o;
}

var STORE_KEY="noti_mapping_v9";
var MAP={};            // prefijo -> entry
var SORTED_KEYS=[];    // claves ordenadas por longitud desc (para match más largo)
var rows=[];           // filas cargadas
var uid=0;

/* ---------- Persistencia del mapeo ---------- */
function loadMap(){
  MAP=defaultMapObj();
  try{
    var saved=JSON.parse(localStorage.getItem(STORE_KEY)||"{}");
    Object.keys(saved).forEach(function(k){ MAP[k]=saved[k]; });
  }catch(e){}
  recomputeKeys();
}
function saveMap(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(MAP)); }catch(e){} }
function recomputeKeys(){ SORTED_KEYS=Object.keys(MAP).sort(function(a,b){ return b.length-a.length || a.localeCompare(b); }); }

/* ---------- Utilidades ---------- */
function norm(s){ return (s==null?"":String(s)).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/\s+/g," "); }
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return esc(s).replace(/"/g,"&quot;"); }

function upNoAcc(s){ return norm(s).toUpperCase(); }   /* sin acentos, en mayúsculas */

/* Códigos de CLASE/TIPO DE ORDEN (EI-5…, PM01, ZM02…). Mezclan letras y números pero se repiten
   igual en todas las filas: nunca son el TAG del equipo. Añade aquí otros tipos si aparecen. */
var RE_TIPO_ORDEN=/^(EI|PM|ZM|IW|MN)-?\d/;
function esTipoOrden(tok){ return RE_TIPO_ORDEN.test(upNoAcc(tok)); }

/* Un token "parece TAG" si mezcla letras y números (PT-3110, 3110-PIT-001, PT3110)
   y no es un código de tipo de orden. */
function looksLikeTag(tok){
  var t=upNoAcc(tok);
  return /[A-Z]/.test(t) && /[0-9]/.test(t) && !esTipoOrden(t);
}

/* TAG = primer token que parezca TAG; si ninguno lo parece, el primer token (comportamiento previo).
   Cubre denominaciones como "TRANSMISOR DE PRESION PT-3110", donde el TAG no va al inicio. */
function tagOf(denom){
  var toks=String(denom||"").trim().split(/\s+/).filter(Boolean);
  if(!toks.length) return "";
  for(var i=0;i<toks.length;i++){ if(looksLikeTag(toks[i])) return toks[i]; }
  for(var j=0;j<toks.length;j++){ if(!esTipoOrden(toks[j])) return toks[j]; }  // ni siquiera como respaldo
  return "";
}
/* Texto sin los códigos de tipo de orden (para mostrar). */
function sinTipoOrden(s){
  return String(s||"").split(/\s+/).filter(function(t){ return t&&!esTipoOrden(t); }).join(" ").trim();
}

/* Grupos de letras que anteceden a un número: "3110-PIT-001" -> ["PIT"] (ignora el área numérica). */
function prefixCandidates(s){
  var t=upNoAcc(s).replace(/[^A-Z0-9]+/g," "), out=[], re=/([A-Z]+)\s*[0-9]/g, m;
  while((m=re.exec(t))!==null){ out.push(m[1]); re.lastIndex=m.index+m[1].length; }
  return out;
}

/* Variantes ISA quitando la "I" de indicador intermedia: LIT->LT, FIT->FT, PIT->PT, PDIT->PDT. */
function isaVariants(L){
  var out=[];
  for(var i=1;i<L.length-1;i++){ if(L.charAt(i)==="I") out.push(L.slice(0,i)+L.slice(i+1)); }
  return out;
}

/* Coincidencia fuerte: la clave tal cual, o su variante ISA sin la "I". */
function keyExact(L){
  if(!L) return null;
  if(MAP[L]) return L;
  var v=isaVariants(L);
  for(var j=0;j<v.length;j++){ if(MAP[v[j]]) return v[j]; }
  return null;
}
/* Coincidencia débil: prefijo más largo del mapeo contenido al inicio de las letras. */
function keyByPrefix(L){
  if(!L) return null;
  for(var i=0;i<SORTED_KEYS.length;i++){ var k=SORTED_KEYS[i]; if(L.indexOf(k)===0) return k; }
  return null;
}
function keyForLetters(L){ return keyExact(L)||keyByPrefix(L); }

/* Orden de resolución: primero las coincidencias fuertes (letras iniciales y luego los grupos
   pegados a un número, que es donde vive el TAG real), y solo al final el match por prefijo.
   Así "TCM-PIT-1234" resuelve PIT y no TC. */
function matchPrefix(tag){
  if(esTipoOrden(tag)) return null;
  var m=upNoAcc(tag).match(/^[A-Z]+/), head=m?m[0]:null;
  var c=prefixCandidates(tag), i, k;
  k=keyExact(head); if(k) return k;
  for(i=0;i<c.length;i++){ k=keyExact(c[i]); if(k) return k; }
  for(i=0;i<c.length;i++){ k=keyByPrefix(c[i]); if(k) return k; }
  return keyByPrefix(head);
}

/* WT comparte prefijo entre peso y torque: si el nombre dice "torque", se enruta al procedimiento
   de torque (WT-TORQUE, con opciones por centrífuga); si no, se queda en peso (P-SG-04533). */
function ajustaWT(k, denom){
  if(k==="WT" && MAP["WT-TORQUE"] && /\bTORQUE\b/.test(upNoAcc(denom))) return "WT-TORQUE";
  return k;
}
/* Si el TAG no resuelve, se buscan candidatos en el resto de la denominación. */
function detectKey(tag, denom){
  var k=matchPrefix(tag);
  if(!k){
    var c=prefixCandidates(sinTipoOrden(denom)), i;
    for(i=0;i<c.length && !k;i++){ k=keyExact(c[i]); }
    for(i=0;i<c.length && !k;i++){ k=keyByPrefix(c[i]); }
  }
  return ajustaWT(k, denom);
}

/* Fecha: Date -> dd/mm/aaaa ; serial Excel -> fecha ; texto tal cual */
function fmtDate(v){
  if(v==null||v==="") return "";
  if(Object.prototype.toString.call(v)==="[object Date]" && !isNaN(v)){
    return pad(v.getDate())+"/"+pad(v.getMonth()+1)+"/"+v.getFullYear();
  }
  if(typeof v==="number" && v>20000 && v<90000){
    var d=new Date(Math.round((v-25569)*86400000));
    return pad(d.getUTCDate())+"/"+pad(d.getUTCMonth()+1)+"/"+d.getUTCFullYear();
  }
  var s=String(v).trim();
  return parseFecha(s)||s;
}
function pad(n){ return (n<10?"0":"")+n; }

/* Fecha escrita en texto -> dd/mm/aaaa. Acepta dd/mm/aaaa, dd-mm-aa, dd.mm.aaaa (SAP) y aaaa-mm-dd.
   Devuelve null si la celda no es una fecha. */
var RE_FECHA=/\b(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/;
function parseFecha(v){
  if(v==null) return null;
  var m=String(v).trim().match(RE_FECHA); if(!m) return null;
  var a=parseInt(m[1],10), b=parseInt(m[2],10), c=parseInt(m[3],10), d, mes, anio;
  if(m[1].length===4){ anio=a; mes=b; d=c; }        // aaaa-mm-dd
  else { d=a; mes=b; anio=c; if(m[3].length===2) anio+=(anio<70?2000:1900); }
  if(!(d>=1&&d<=31&&mes>=1&&mes<=12)) return null;
  return pad(d)+"/"+pad(mes)+"/"+anio;
}
/* Primera celda que sea una fecha; devuelve {fecha, idx} o null */
function findFecha(cells){
  for(var i=0;i<cells.length;i++){ var f=parseFecha(cells[i]); if(f) return {fecha:f,idx:i}; }
  return null;
}

/* ---------- Construcción de filas ---------- */
function makeRow(ot, denom, equipo, fecha){
  var row={ id:(++uid), ot:String(ot==null?"":ot).trim(), denom:String(denom||"").trim(),
    tag:tagOf(denom), equipo:String(equipo==null?"":equipo).trim(), fecha:String(fecha||"").trim(),
    key:null, proc:"", nombre:"", optIndex:-1, hasOpts:false, isValve:false, valFalla:"", valTecno:"", saved:false,
    // undefined = aún no editado por el usuario; recompAuto lo rellena con el texto automático.
    // `recibido` es manual (no se autocalcula): arranca vacío.
    fields:{comoEncontro:undefined,falla:undefined,motivo:undefined,descripcion:undefined,comoDejo:undefined,equipos:undefined,tecnico:undefined,recibido:""} };
  // Si la denominación no trae un TAG reconocible, se toma el de la columna de equipo.
  if(!looksLikeTag(row.tag) && looksLikeTag(row.equipo)) row.tag=tagOf(row.equipo);
  row.key=detectKey(row.tag,row.denom);
  recompAuto(row);
  return row;
}
function valveTable(falla, tecno){
  if(!falla||!tecno) return "(Seleccione el tipo de falla y la tecnología de señal en los desplegables para generar la tabla.)";
  var header, pairs;
  if(tecno==="fieldbus"){ header="generado (%)\t\tposición real (%)"; pairs=[[0,0],[25,25],[50,50],[75,75],[100,100]]; }
  else { header="generado (mA)\t\tposición real (%)";
    pairs=(falla==="abierta")?[[4,100],[8,75],[12,50],[16,25],[20,0]]:[[4,0],[8,25],[12,50],[16,75],[20,100]]; }
  var out=[header];
  pairs.forEach(function(p){ out.push(p[0]+"\t\t\t"+p[1]); });
  return out.join("\n");
}

/* TAG_RANGES:FIN */
function normTag(t){ return upNoAcc(t).replace(/[^A-Z0-9]+/g,""); }

/* Datos de calibración = base incrustada (TAG_RANGES) + override adjuntado por el usuario
   (datos_calibracion.json) guardado en localStorage. El override manda; si le falta un TAG,
   se recurre a la base incrustada. Así se puede reescanear a futuro sin reconstruir el HTML. */
var CAL_STORE_KEY="noti_calib_v1";
var CAL_OVERRIDE=(function(){ try{ return JSON.parse(localStorage.getItem(CAL_STORE_KEY))||null; }catch(e){ return null; } })();
function calibSrc(){ return (CAL_OVERRIDE&&CAL_OVERRIDE.tags)?CAL_OVERRIDE.tags:null; }
function lookupIn(src,k){
  if(!src) return null;
  if(src[k]) return src[k];
  var sinArea=k.replace(/^\d+/,"");                 // TAG con área delante (3110PT001) o sin ella
  if(sinArea!==k && src[sinArea]) return src[sinArea];
  return null;
}
/* Devuelve {r,s,p} del TAG, o null si no está en la base (nunca se inventa). */
function rangoDe(tag){
  var k=normTag(tag); if(!k) return null;
  return lookupIn(calibSrc(),k) || lookupIn(TAG_RANGES,k);
}
function patronesDe(tag){ var d=rangoDe(tag); return (d&&d.p&&d.p.length)?d.p:[]; }

var TXT_RANGO="Calibrado en el rango de:";
var TXT_SALIDA="para una salida de:";
/* Línea "Calibrado en el rango de: X para una salida de: Y" (los datos vacíos dejan solo la etiqueta). */
function lineaCalib(row){
  return TXT_RANGO+(row.rango?(" "+row.rango):"")+" "+TXT_SALIDA+(row.salida?(" "+row.salida):"");
}
/* Texto del campo "patrones utilizados": una línea "TAG - descripción" por patrón del reporte más
   reciente. Si no hay patrones en la base, devuelve "" (el campo cae a los equipos del procedimiento). */
function patronesTexto(row){
  var p=row.patrones||[];
  if(!p.length) return "";
  return p.map(function(x){ var t=x[0]||"", d=x[1]||""; return t+(d?(" - "+d):""); }).join("\n");
}
/* "Trabajo realizado por": nombre del técnico del último reporte de calibración (WHOCALIBRATED),
   PERO solo si ese reporte es RECIENTE (menos de 2 meses respecto a la fecha de la plantilla).
   Si el reporte es antiguo (2 meses o más), o faltan fechas, se deja vacío para llenar a mano. */
function parseISO(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"")); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function parseDMY(s){ var f=parseFecha(s); if(!f) return null; var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(f); return m?new Date(+m[3],+m[2]-1,+m[1]):null; }
function addMonths(d,n){ var x=new Date(d.getTime()); x.setMonth(x.getMonth()+n); return x; }
function autoTecnico(row){
  var d=rangoDe(row.tag); if(!d||!d.by) return "";
  var rep=parseISO(d.d), work=parseDMY(row.fecha);
  if(!rep||!work) return "";                 // sin fechas no se evalúa -> vacío (manual)
  if(work>=addMonths(rep,2)) return "";       // reporte antiguo (2+ meses) -> vacío (manual)
  return d.by;                                // reporte reciente (<2 meses) -> nombre del técnico
}
/* Aplica el técnico automático respetando la edición manual (undefined o == último auto). */
function aplicaTecnico(row){
  var t=autoTecnico(row);
  if(row.fields.tecnico===undefined || row.fields.tecnico===row._autoTec) row.fields.tecnico=t;
  row._autoTec=t;
}

/* Prefijos cuya descripción cierra avisando que la calibración va anexa a la orden.
   PT, PIT, LT y LIT tienen entrada propia en el mapeo. */
var CALIB_ANEXA={PT:1, PIT:1, LT:1, LIT:1};
var NOTA_CALIB="Datos de calibración se encuentran anexos a la orden de trabajo.";
/* Switches de presión: la prueba de repetibilidad se hace subiendo (PSH, alta) o bajando (PSL, baja). */
var SWITCH_DIR={PSH:"subiendo", PSL:"bajando"};

/* ---------- Textos automáticos de los campos, según el tipo de equipo ----------
   Todos son editables: en cuanto el técnico cambia un campo, deja de recalcularse. */
var TIPO_TXT={
  transmisor: { art:"el", nom:"transmisor",
    dejo:"en servicio, calibrado, dentro de tolerancia y transmitiendo correctamente la señal al sistema de control" },
  indicador:  { art:"el", nom:"indicador",
    dejo:"en servicio, calibrado y con lectura correcta en sitio" },
  controlador:{ art:"el", nom:"controlador",
    dejo:"en servicio, calibrado, dentro de tolerancia y controlando correctamente la variable" },
  valvula:    { art:"la", nom:"válvula",
    dejo:"en servicio, con recorrido y posición verificados en todo el rango y sin fugas" },
  solenoide:  { art:"la", nom:"válvula solenoide",
    dejo:"en servicio, con energización, desenergización y tiempo de respuesta verificados" },
  elemento:   { art:"el", nom:"elemento de medición",
    dejo:"instalado y en servicio, con medición correcta y conexión firme" },
  analizador: { art:"el", nom:"analizador",
    dejo:"en servicio, calibrado con gas patrón y dentro de tolerancia" },
  detector:   { art:"el", nom:"detector",
    dejo:"en servicio, con la señal y la lógica de disparo verificadas" },
  visor:      { art:"el", nom:"visor de nivel",
    dejo:"en servicio, limpio, con nivel visible y sin fugas" },
  equipo:     { art:"el", nom:"equipo",
    dejo:"en servicio, operando en condiciones normales" }
};
function tipoDe(row){
  if(row.isValve) return "valvula";
  var n=norm(row.nombre||"");
  if(!n) return "equipo";
  if(n.indexOf("solenoide")>=0) return "solenoide";
  if(n.indexOf("valvula")>=0) return "valvula";
  if(n.indexOf("analizador")>=0) return "analizador";   // antes que transmisor: "Analizador/transmisor de gas"
  if(n.indexOf("detector")>=0) return "detector";
  if(n.indexOf("visor")>=0) return "visor";
  if(n.indexOf("transmisor")>=0) return "transmisor";
  if(n.indexOf("controlador")>=0) return "controlador";
  if(n.indexOf("elemento")>=0) return "elemento";
  if(n.indexOf("indicador")>=0||n.indexOf("manometro")>=0||n.indexOf("termometro")>=0) return "indicador";
  return "equipo";
}
function autoFields(row){
  var t=TIPO_TXT[tipoDe(row)], eq=t.art+" "+t.nom, Eq=t.art.charAt(0).toUpperCase()+t.art.slice(1)+" "+t.nom;
  // Si la nota del último reporte registró la indicación con que quedó el equipo, se añade con su valor.
  var indic=(row.indicacion?(" Se dejó con indicación de "+row.indicacion+"."):"");
  return {
    comoEncontro: "Se encontró "+eq+" en servicio, operando en condiciones normales, sin daño físico ni alarmas asociadas.",
    falla: "Sin falla presentada. "+Eq+" operaba normalmente al momento de la intervención.",
    motivo: "Mantenimiento preventivo programado según el plan de mantenimiento"+(row.proc?(" (procedimiento "+row.proc+")"):"")+".",
    comoDejo: "Se dejó "+eq+" "+t.dejo+"; se entregó a operaciones."+indic
  };
}

function recompAuto(row){
  row.key=detectKey(row.tag,row.denom);
  var rg=rangoDe(row.tag);             // {r,s,p} o null si el TAG no está en la base de calibración
  row.rango=rg&&rg.r?rg.r:"";          // rango de entrada (medida)
  row.salida=rg&&rg.s?rg.s:"";         // señal de salida escalada
  row.patrones=(rg&&rg.p)?rg.p:[];     // patrones del reporte de calibración más reciente
  row.indicacion=(rg&&rg.li)?rg.li:""; // indicación con que se dejó el equipo (nota del reporte)
  var e=row.key?MAP[row.key]:null;
  var src=e;
  row.hasOpts=!!(e&&e.opciones&&e.opciones.length);
  row.isValve=!!(e&&e.tipo==="valvula");
  if(row.hasOpts){
    if(typeof row.optIndex!=="number"||row.optIndex<0||row.optIndex>=e.opciones.length){ row.optIndex=-1; src=null; }
    else { src=e.opciones[row.optIndex]; }
  }
  row.proc=src&&src.proc?src.proc:"";
  row.nombre=(src&&src.nombre)?src.nombre:(e?e.nombre:"");
  var pdesc=src&&src.descripcion?src.descripcion:"";
  var peq=src&&src.equipos?src.equipos:"";
  var autoDesc;
  if(row.proc){
    autoDesc="Procedimiento "+row.proc+" asociado al TAG "+row.tag+(row.nombre?(" - "+row.nombre):"")+"."+(pdesc?("\n"+pdesc):"");
    if(row.isValve){ autoDesc+="\n\nVerificación de posición (valores generados vs. posición real):\n"+valveTable(row.valFalla,row.valTecno); }
    if(SWITCH_DIR[row.key]){
      // Switch de presión: prueba de repetibilidad con el SET (subiendo=PSH / bajando=PSL).
      autoDesc+="\nSe realizaron pruebas de repetibilidad satisfactorias con el SET de:"+(row.rango?(" "+row.rango):"")+" "+SWITCH_DIR[row.key]+".";
    } else {
      autoDesc+="\n"+lineaCalib(row);
    }
    if(CALIB_ANEXA[row.key]) autoDesc+="\n"+NOTA_CALIB;
  } else if(row.hasOpts){
    autoDesc="Seleccione la variante del procedimiento para el TAG "+row.tag+(e&&e.nombre?(" ("+e.nombre+")"):"")+" en el desplegable superior.";
  } else {
    autoDesc="Plantilla genérica (sin procedimiento asignado para el TAG "+row.tag+(row.nombre?(" - "+row.nombre):"")+"). Describa el trabajo de mantenimiento realizado sobre el equipo.";
  }
  autoDesc=autoDesc.split(/\n+/).join("\n\n");   // una línea en blanco después de cada línea
  // Campo "¿Qué equipos o patrones se utilizaron?": si la base tiene los patrones del reporte más
  // reciente (TAG + descripción), se usan esos; si no, los equipos del procedimiento; si no, el aviso.
  var patTxt=patronesTexto(row);
  var autoEq = patTxt ? ("Patrones utilizados:\n"+patTxt)
             : (peq ? peq : (row.proc ? "" : "Registre los equipos, herramientas o patrones utilizados durante la intervención."));
  if(row.fields.descripcion===undefined || row.fields.descripcion===row._autoDesc){ row.fields.descripcion=autoDesc; }
  if(row.fields.equipos===undefined || row.fields.equipos===row._autoEq){ row.fields.equipos=autoEq; }
  row._autoDesc=autoDesc; row._autoEq=autoEq;
  // Resto de campos: se rellenan solos mientras el técnico no los haya editado.
  var af=autoFields(row);
  row._auto=row._auto||{};
  ["comoEncontro","falla","motivo","comoDejo"].forEach(function(f){
    if(row.fields[f]===undefined || row.fields[f]===row._auto[f]) row.fields[f]=af[f];
    row._auto[f]=af[f];
  });
  aplicaTecnico(row);   // "Trabajo realizado por" (depende de la fecha de la plantilla)
}

/* ---------- Texto de la plantilla ---------- */
/* Una línea en blanco después de cada línea (requisito de la descripción del trabajo). Idempotente. */
function conEnters(s){ return (s==null?"":String(s)).split(/\n+/).join("\n\n"); }
function genText(row){
  var f=row.fields, fi=row.fecha||"";
  var body=[
    "Fecha de inicio: "+fi, "",
    "Cómo se encontró el equipo:", (f.comoEncontro||""), "",
    "Falla presentada:", (f.falla||""), "",
    "Motivo del mantenimiento:", (f.motivo||""), "",
    "Descripción del trabajo realizado:", conEnters(f.descripcion), "",
    "Cómo se dejó el equipo:", (f.comoDejo||""), "",
    "¿Qué equipos o patrones se utilizaron?:", (f.equipos||""), "",
    "Fecha fin: "+fi, "",
    "Trabajo realizado por: "+(f.tecnico||""), "",
    "Trabajo recibido por: "+(f.recibido||""), ""
  ].join("\n");
  // Requisito: toda línea del .txt debe empezar por un punto (.)
  return body.split(/\r\n|\r|\n/).map(function(l){ return "."+l; }).join("\r\n");
}
function fileNameOf(row){
  var base=(row.ot||"SIN_OT")+"-"+(row.tag||"SIN_TAG");
  return base.replace(/[\\\/:*?"<>|\s]+/g,"_")+".txt";
}

/* ---------- Descargas ---------- */
function triggerBlob(blob, filename){
  var a=document.createElement("a"), url=URL.createObjectURL(blob);
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },120);
}
function downloadText(filename, text){ triggerBlob(new Blob([text],{type:"text/plain;charset=utf-8"}), filename); }

/* ---------- ZIP (método store, sin dependencias) ---------- */
var CRC_TABLE=(function(){ var t=[],c; for(var n=0;n<256;n++){ c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(bytes){ var c=0xFFFFFFFF; for(var i=0;i<bytes.length;i++) c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  var enc=new TextEncoder(), parts=[], central=[], offset=0;
  function u16(n){ return [n&0xff,(n>>8)&0xff]; }
  function u32(n){ return [n&0xff,(n>>8)&0xff,(n>>16)&0xff,(n>>>24)&0xff]; }
  files.forEach(function(f){
    var nameB=enc.encode(f.name), dataB=enc.encode(f.content), crc=crc32(dataB);
    var local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(dataB.length),u32(dataB.length),u16(nameB.length),u16(0));
    parts.push(new Uint8Array(local),nameB,dataB);
    var cd=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(dataB.length),u32(dataB.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push(new Uint8Array(cd),nameB);
    offset+=local.length+nameB.length+dataB.length;
  });
  var cdSize=0; central.forEach(function(c){ cdSize+=c.length; });
  var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(offset),u16(0)));
  var all=parts.concat(central,[end]), total=0; all.forEach(function(a){ total+=a.length; });
  var out=new Uint8Array(total), p=0; all.forEach(function(a){ out.set(a,p); p+=a.length; });
  return out;
}
function uniqueNames(list){
  var seen={}, res=[];
  list.forEach(function(f){
    var n=f.name, i=1;
    while(seen[n]){ n=f.name.replace(/\.txt$/,"")+"_"+(++i)+".txt"; }
    seen[n]=1; res.push({name:n,content:f.content});
  });
  return res;
}

      '<div class="fechafin">Fecha fin (igual a la de inicio): <span class="ffin" data-ffin="'+r.id+'">'+esc(r.fecha||"")+'</span></div>'+
      '<label class="full">Trabajo realizado por'+
        '<input type="text" data-id="'+r.id+'" data-f="tecnico" value="'+escAttr(r.fields.tecnico||"")+'" placeholder="Nombre del técnico (se ingresa manualmente si el reporte es antiguo)"></label>'+
      '<label class="full">Trabajo recibido por'+
        '<input type="text" data-id="'+r.id+'" data-f="recibido" value="'+escAttr(r.fields.recibido||"")+'" placeholder="Nombre de quien recibe el trabajo"></label>'+
    '</div>'+
    '<div class="rowactions">'+
      '<button class="btn" data-preview="'+r.id+'">'+(previewOpen?"Ocultar vista previa":"Vista previa")+'</button>'+
      '<button class="btn" data-copy="'+r.id+'">Copiar al portapapeles</button>'+
      '<button class="btn" data-dl="'+r.id+'">Descargar '+esc(fileNameOf(r))+'</button>'+
      '<button class="btn primary" data-save="'+r.id+'">Guardar</button>'+
    '</div>'+
    (previewOpen?('<div class="previewwrap"><div class="previewhd">Vista previa de '+esc(fileNameOf(r))+' (así se descargará)</div><pre class="previewbox" id="previewBox">'+esc(genText(r))+'</pre></div>'):'')+
  '</div>';
}
function renderRows(){
  if(typeof saveSession==="function") saveSession();   // persistir la sesión en cada render
  if(!rows.length){ resultsCard.style.display="none"; return; }
  resultsCard.style.display="block";
  countBadge.textContent=rows.length+(rows.length===1?" orden":" órdenes");
  // No se muestra ninguna plantilla al inicio: solo cuando el usuario elige una del desplegable.
  if(currentId!==null && !rows.some(function(r){ return r.id===currentId; })) currentId=null;
  var savedCount=rows.filter(function(r){ return r.saved; }).length;
  var placeholder='<option value=""'+(currentId===null?' selected':'')+'>— Selecciona una orden —</option>';
  var options=placeholder+rows.map(function(r){
    return '<option value="'+r.id+'"'+(r.id===currentId?' selected':'')+'>'+esc(optionLabel(r))+'</option>';
  }).join("");
  var bar='<div class="selectbar">'+
    '<label class="full">Orden a editar — '+savedCount+' de '+rows.length+' guardadas'+
      '<select id="orderSelect">'+options+'</select></label>'+
  '</div>';
  var body=(currentId===null)
    ? '<div class="emptysel">Selecciona una orden de la lista para ver y editar su plantilla.</div>'
    : cardHtml(byId(currentId));
  rowsEl.innerHTML=bar+body;
}
function copyToClipboard(text, btn){
  function ok(){ if(btn){ var t=btn.getAttribute("data-lbl")||btn.textContent; btn.setAttribute("data-lbl",t); btn.textContent="¡Copiado!"; setTimeout(function(){ btn.textContent=t; },1300); } }
  function fallback(){ var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select(); try{ document.execCommand("copy"); ok(); }catch(e){ alert("No se pudo copiar automáticamente."); } ta.remove(); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok, fallback); }
  else { fallback(); }
}
rowsEl.addEventListener("input", function(e){
  var el=e.target, id=el.getAttribute("data-id"), f=el.getAttribute("data-f");
  if(!id||!f) return;
  var row=rows.filter(function(r){ return r.id==id; })[0]; if(!row) return;
  if(f==="fecha"){
    row.fecha=el.value;
    var span=rowsEl.querySelector('.ffin[data-ffin="'+id+'"]'); if(span) span.textContent=el.value;
    // "Trabajo realizado por" depende de la fecha: se recalcula (si no se editó a mano).
    aplicaTecnico(row);
    var tin=rowsEl.querySelector('input[data-f="tecnico"][data-id="'+id+'"]');
    if(tin && document.activeElement!==tin) tin.value=row.fields.tecnico||"";
  } else { row.fields[f]=el.value; }
  if(previewOpen){ var pb=document.getElementById("previewBox"); if(pb) pb.textContent=genText(row); }
  saveSessionSoon();   // auto-guardado de la edición (con debounce)
});
rowsEl.addEventListener("change", function(e){
  var el=e.target;
  if(el.id==="orderSelect"){ currentId=(el.value===""?null:parseInt(el.value,10)); previewOpen=false; renderRows(); return; }
  var id=el.getAttribute("data-id");
  var row=id?byId(id):null; if(!row) return;
  if(el.getAttribute("data-opt")==="1"){ row.optIndex=parseInt(el.value,10); recompAuto(row); renderRows(); return; }
  var vf=el.getAttribute("data-valfld");
  if(vf){ row[vf]=el.value; recompAuto(row); renderRows(); return; }
});
rowsEl.addEventListener("click", function(e){
  var pv=e.target.closest("[data-preview]");
  if(pv){ previewOpen=!previewOpen; renderRows(); return; }
  var dl=e.target.closest("[data-dl]");
  if(dl){ var r=byId(dl.getAttribute("data-dl")); if(r){ r.saved=true; downloadText(fileNameOf(r), genText(r)); renderRows(); } return; }
  var cp=e.target.closest("[data-copy]");
  if(cp){ var r2=byId(cp.getAttribute("data-copy")); if(r2) copyToClipboard(genText(r2), cp); return; }
  var sv=e.target.closest("[data-save]");
  if(sv){ var r3=byId(sv.getAttribute("data-save")); if(r3){ r3.saved=true; renderRows(); } return; }
});

/* ---------- Entrada: Excel ---------- */
document.getElementById("fileInput").addEventListener("change", function(e){
  var file=e.target.files&&e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var recs=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
      if(!recs.length){ alert("La hoja está vacía o no tiene encabezados."); return; }
      var cols=detectCols(recs[0]);
      if(!cols.otKey && !cols.denomKey){ alert("No encontré columnas OT ni 'denominación de objeto técnico'. Revisa los encabezados."); return; }
      rows=recs.map(function(rec){
        return makeRow(
          cols.otKey?rec[cols.otKey]:"",
          cols.denomKey?rec[cols.denomKey]:"",
          cols.equipoKey?rec[cols.equipoKey]:"",
          cols.fechaKey?fmtDate(rec[cols.fechaKey]):""
        );
      }).filter(function(r){ return r.ot!=="" || r.denom!==""; });
      renderRows();
      if(!rows.length) alert("No se generaron filas con datos.");
    }catch(err){ alert("No pude leer el archivo: "+err.message); }
  };
  reader.readAsArrayBuffer(file);
});
/* Matchers de columna (mismo criterio para Excel y pegado) */
var COL={
  ot:    function(n){ return n==="ot"||n==="o.t."||n==="o.t"||n.indexOf("orden")===0; },
  denom: function(n){ return n.indexOf("denominacion")>=0 || n==="tag" || n.indexOf("objeto tecnico")>=0; },
  equipo:function(n){ return n.indexOf("equipo")>=0; }
};
/* Detección sobre encabezados de objeto (Excel): devuelve nombres de clave */
function detectCols(sample){
  var keys=Object.keys(sample);
  function pick(test){ for(var i=0;i<keys.length;i++){ if(test(norm(keys[i]))) return keys[i]; } return null; }
  var fechaKey=pick(function(n){ return n.indexOf("fecha inicio")>=0 || n.indexOf("fecha de inicio")>=0; })
            || pick(function(n){ return n.indexOf("inicio")>=0; })
            || pick(function(n){ return n.indexOf("fecha")>=0; });
  return {otKey:pick(COL.ot),denomKey:pick(COL.denom),equipoKey:pick(COL.equipo),fechaKey:fechaKey};
}
/* Detección sobre una fila de encabezados (pegado): devuelve índices de columna (-1 si no está) */
function detectColIdx(header){
  var H=header.map(function(h){ return norm(h); });
  function pick(test){ for(var i=0;i<H.length;i++){ if(test(H[i])) return i; } return -1; }
  var f=pick(function(n){ return n.indexOf("fecha inicio")>=0 || n.indexOf("fecha de inicio")>=0; });
  if(f<0) f=pick(function(n){ return n.indexOf("inicio")>=0; });
  if(f<0) f=pick(function(n){ return n.indexOf("fecha")>=0; });
  return {ot:pick(COL.ot),denom:pick(COL.denom),equipo:pick(COL.equipo),fecha:f};
}

/* ---------- Entrada: pegado ---------- */
document.getElementById("btnPaste").addEventListener("click", function(){
  var txt=document.getElementById("pasteArea").value;
  var lines=txt.split(/\r?\n/).filter(function(l){ return l.trim()!==""; });
  if(!lines.length){ alert("Pega primero la tabla."); return; }
  // La tabla puede tener cualquier número de columnas; se usan SOLO OT, fecha y denominación.
  var table=lines.map(function(line){
    var cells=line.indexOf("\t")>=0 ? line.split("\t") : line.split(/\s{2,}/);
    return cells.map(function(c){ return c.trim(); });
  });
  var idx=detectColIdx(table[0]);
  var out=[];
  if(idx.ot>=0 || idx.denom>=0){
    // Modo encabezado: la primera fila son títulos; analizar solo las columnas detectadas.
    for(var i=1;i<table.length;i++){
      var c=table[i];
      var ot=idx.ot>=0?(c[idx.ot]||""):"";
      var denom=idx.denom>=0?(c[idx.denom]||""):"";
      var equipo=idx.equipo>=0?(c[idx.equipo]||""):"";
      var fecha=idx.fecha>=0?(parseFecha(c[idx.fecha])||fmtDate(c[idx.fecha]||"")):"";
      // Sin columna de fecha reconocida: se busca una fecha en el resto de celdas.
      if(!fecha){ var hit=findFecha(c.filter(function(_,j){ return j!==idx.ot && j!==idx.denom && j!==idx.equipo; })); if(hit) fecha=hit.fecha; }
      if(String(ot).trim()==="" && String(denom).trim()==="") continue;
      out.push(makeRow(ot,denom,equipo,fecha));
    }
  } else {
    // Sin encabezados reconocibles: se separan OT, fecha y denominación por su forma.
    table.forEach(function(c){
      var cells=(c.length===1?String(c[0]).split(/\s+/):c).map(function(x){ return String(x||"").trim(); });
      var fecha="", hit=findFecha(cells);
      if(hit){ fecha=hit.fecha; cells.splice(hit.idx,1); }
      var ot="", oi=-1;
      for(var j=0;j<cells.length;j++){ if(/^\d{4,}$/.test(cells[j].replace(/\s+/g,""))){ ot=cells[j]; oi=j; break; } }
      if(oi<0 && cells.length){ ot=cells[0]; oi=0; }
      var denom=cells.filter(function(_,j){ return j!==oi; }).join(" ").trim();
      if(ot==="" && denom==="") return;
      out.push(makeRow(ot,denom,"",fecha));
    });
  }
  if(!out.length){ alert("No pude interpretar filas. Incluye una fila de encabezados con las columnas OT y denominación de objeto técnico (separadas por tabulador)."); return; }
  rows=out; renderRows();
});

/* ---------- Descargar todos (.zip) ---------- */
document.getElementById("btnZip").addEventListener("click", function(){
  if(!rows.length) return;
  var files=uniqueNames(rows.map(function(r){ return {name:fileNameOf(r), content:genText(r)}; }));
  var bytes=makeZip(files);
  triggerBlob(new Blob([bytes],{type:"application/zip"}), "notificaciones.zip");
});

/* ---------- Gestión del mapeo ---------- */
var mapList=document.getElementById("mapList");
function renderMap(){
  var keys=Object.keys(MAP).sort(function(a,b){ return a.localeCompare(b); });
  if(!keys.length){ mapList.innerHTML='<p class="empty">Sin prefijos.</p>'; return; }
  var rowsHtml=keys.map(function(k){
    var e=MAP[k];
    return '<tr>'+
      '<td><code>'+esc(k)+'</code></td>'+
      '<td>'+esc(e.nombre||"")+'</td>'+
      '<td>'+(e.proc?esc(e.proc):(e.opciones&&e.opciones.length?'<span class="badge info">'+e.opciones.length+' opciones</span>':'<span class="badge warn">falta</span>'))+'</td>'+
      '<td class="actions">'+
        '<button class="lnk" data-edit="'+esc(k)+'">editar</button>'+
        '<button class="lnk del" data-del="'+esc(k)+'">borrar</button>'+
      '</td></tr>';
  }).join("");
  mapList.innerHTML='<table class="map"><thead><tr><th>Prefijo</th><th>Nombre</th><th>Procedimiento</th><th></th></tr></thead><tbody>'+rowsHtml+'</tbody></table>';
}
mapList.addEventListener("click", function(e){
  var ed=e.target.closest("[data-edit]"), de=e.target.closest("[data-del]");
  if(ed){
    var k=ed.getAttribute("data-edit"), en=MAP[k]; if(!en) return;
    document.getElementById("mPref").value=en.prefijo;
    document.getElementById("mProc").value=en.proc||"";
    document.getElementById("mNom").value=en.nombre||"";
    document.getElementById("mDesc").value=en.descripcion||"";
    document.getElementById("mEq").value=en.equipos||"";
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  } else if(de){
    var kk=de.getAttribute("data-del");
    if(confirm("¿Borrar el prefijo "+kk+"?")){ delete MAP[kk]; saveMap(); refreshAll(); }
  }
});
document.getElementById("btnAddMap").addEventListener("click", function(){
  var pref=document.getElementById("mPref").value.trim().toUpperCase();
  if(!pref){ alert("Indica el prefijo (TAG)."); return; }
  MAP[pref]={ prefijo:pref,
    nombre:document.getElementById("mNom").value.trim(),
    proc:document.getElementById("mProc").value.trim(),
    descripcion:document.getElementById("mDesc").value,
    equipos:document.getElementById("mEq").value };
  saveMap(); refreshAll();
  ["mPref","mProc","mNom","mDesc","mEq"].forEach(function(id){ document.getElementById(id).value=""; });
});
document.getElementById("btnExport").addEventListener("click", function(){
  triggerBlob(new Blob([JSON.stringify(MAP,null,2)],{type:"application/json"}), "mapeo_tags.json");
});
document.getElementById("importMap").addEventListener("change", function(e){
  var file=e.target.files&&e.target.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var obj=JSON.parse(ev.target.result);
      MAP=defaultMapObj();
      Object.keys(obj).forEach(function(k){ MAP[k]=obj[k]; });
      saveMap(); refreshAll(); alert("Mapeo importado.");
    }catch(err){ alert("JSON inválido: "+err.message); }
  };
  r.readAsText(file); e.target.value="";
});
document.getElementById("btnReset").addEventListener("click", function(){
  if(!confirm("¿Restablecer el mapeo a los valores por defecto? Se perderán tus cambios guardados.")) return;
  localStorage.removeItem(STORE_KEY); loadMap(); refreshAll();
});

/* ---------- Base de calibración: adjuntar datos_calibracion.json / restablecer ---------- */
function calCount(o){ try{ return (o&&o.tags)?Object.keys(o.tags).length:0; }catch(e){ return 0; } }
function renderCalStatus(){
  var el=document.getElementById("calStatus"); if(!el) return;
  if(CAL_OVERRIDE){
    el.innerHTML='<b>Datos actualizados desde archivo</b>'+(CAL_OVERRIDE.generado?(' (generado '+esc(CAL_OVERRIDE.generado)+')'):'')+
      ' — '+calCount(CAL_OVERRIDE)+' instrumentos. Se aplican sobre las órdenes cargadas.';
  } else {
    el.innerHTML='Usando los datos incrustados en la app ('+Object.keys(TAG_RANGES).length+' instrumentos). Adjunta un <code>datos_calibracion.json</code> para actualizar sin reconstruir.';
  }
}
document.getElementById("importCalib").addEventListener("change", function(e){
  var file=e.target.files&&e.target.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var obj=JSON.parse(ev.target.result);
      if(!obj || typeof obj!=="object" || !obj.tags || typeof obj.tags!=="object")
        throw new Error("El archivo no tiene la estructura esperada (falta 'tags').");
      CAL_OVERRIDE=obj;
      localStorage.setItem(CAL_STORE_KEY, JSON.stringify(obj));
      refreshAll();
      alert("Base de calibración actualizada: "+calCount(obj)+" instrumentos"+(obj.generado?(" (generado "+obj.generado+")"):"")+".");
    }catch(err){ alert("No pude leer el archivo de calibración: "+err.message); }
  };
  r.readAsText(file); e.target.value="";
});
document.getElementById("btnCalibReset").addEventListener("click", function(){
  if(!CAL_OVERRIDE){ alert("Ya se están usando los datos incrustados."); return; }
  if(!confirm("¿Volver a los datos de calibración incrustados en la app y descartar el archivo adjuntado?")) return;
  CAL_OVERRIDE=null; localStorage.removeItem(CAL_STORE_KEY); refreshAll();
});

/* ---------- Refresco global (tras cambios de mapeo o de la base de calibración) ---------- */
function refreshAll(){
  recomputeKeys();
  rows.forEach(function(r){ recompAuto(r); });
  renderRows(); renderMap(); renderCalStatus();
}

/* ---------- Auto-guardado de la sesión (órdenes cargadas + ediciones) ----------
   Las filas viven en memoria; para no perder el trabajo si se cierra/recarga el navegador se
   guardan en localStorage y se restauran al abrir. Al restaurar se recalculan los textos automáticos
   (respetando lo editado a mano) para quedar sincronizados con la base de calibración vigente. */
var SESSION_KEY="noti_session_v1";
var _saveTimer=null;
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({v:1, uid:uid, currentId:currentId, rows:rows})); }catch(e){}
}
function saveSessionSoon(){ if(_saveTimer) clearTimeout(_saveTimer); _saveTimer=setTimeout(saveSession, 600); }
function loadSession(){
  try{
    var s=JSON.parse(localStorage.getItem(SESSION_KEY)||"null");
    if(!s || !s.rows || !s.rows.length) return false;
    rows=s.rows;
    uid=s.uid || rows.reduce(function(m,r){ return Math.max(m, r.id||0); }, 0);
    currentId=(s.currentId!=null)?s.currentId:null;
    rows.forEach(function(r){ recompAuto(r); });   // re-sincroniza autos con la base actual; respeta ediciones
    return true;
  }catch(e){ return false; }
}
function clearSession(){
  rows=[]; currentId=null;
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  renderRows();
}
var _btnClear=document.getElementById("btnClearSession");
if(_btnClear) _btnClear.addEventListener("click", function(){
  if(!rows.length){ alert("No hay órdenes cargadas."); return; }
  if(confirm("¿Vaciar la sesión? Se quitarán las "+rows.length+" órdenes cargadas y sus ediciones.")) clearSession();
});

/* ---------- Init ---------- */
loadMap();
renderMap();
renderCalStatus();
if(loadSession()) renderRows();   // retoma la sesión anterior si existe
</script>
